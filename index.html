<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PazarX 3.0 — Pazaryeri</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="header"><div class="logo">Pazar<span>X</span></div>
<div class="search"><input id="search" placeholder="Ürün, kategori veya marka ara..." oninput="searchProducts()"><button>🔎</button></div>
<div class="actions"><button onclick="openLogin()">👤 Hesabım</button><button onclick="openCart()">🛒 <b id="count">0</b></button></div></header>
<nav><button onclick="filter('Tümü')">Tümü</button><button onclick="filter('Elektronik')">Elektronik</button><button onclick="filter('Moda')">Moda</button><button onclick="filter('Ev Yaşam')">Ev Yaşam</button><button onclick="filter('Spor')">Spor</button><button onclick="filter('Güzellik')">Güzellik</button></nav>
<section class="hero"><div><span>PAZARX 3.0</span><h1>Alışverişin yeni<br><strong>merkezi.</strong></h1><p>Ürünleri keşfet, mağazaları incele, favorilerini oluştur.</p><button onclick="document.getElementById('products').scrollIntoView()">Alışverişe Başla →</button></div><div class="heroCard">⚡<b>Fırsat Ürünleri</b><small>Bugünün seçtikleri</small></div></section>
<main><div class="head"><div><h2>Öne Çıkan Ürünler</h2><p id="result"></p></div><select onchange="sortProducts(this.value)"><option value="default">Sırala</option><option value="low">En düşük fiyat</option><option value="high">En yüksek fiyat</option></select></div><div id="products" class="products"></div></main>
<section class="stores"><h2>Öne Çıkan Mağazalar</h2><div class="storeGrid" id="stores"></div></section>
<div id="modal" class="modal"><div id="modalBox" class="modalBox"></div></div>
<footer><b>PazarX</b><span>© 2026 PazarX</span><span>Güvenli alışverişin yeni adresi.</span></footer>
<script src="script.js"></script></body></html>
